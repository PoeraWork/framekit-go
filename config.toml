[ramdisk]
  size_mb = 2048
  mount_point = "R:"
  label = "FrameDisk"

[encoder]
  codec = ""
  fps = 60
  crf = 18
  maxrate = ""
  bufsize = ""
  skip_frames = 0
  [encoder.extra_opts]

[output]
  dir = "D:\\Videos"
  filename_pattern = "{n}.mp4"
  total_frames = 1000
  hibernate = false

[monitor]
  # pattern = ""                 # 留空自动识别末尾数字；高级用法：^(\d+)_9\.bmp$ 等
  poll_interval_ms = 50
  no_new_frame_timeout_s = 60
