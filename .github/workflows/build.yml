name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write   # gh release create 需要写权限

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      # MinGW-w64 工具链 + FFmpeg（开发头文件、静态/共享库、运行时 DLL）
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-ffmpeg

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-I/mingw64/include"
          CGO_LDFLAGS: "-L/mingw64/lib"
          PKG_CONFIG_PATH: "/mingw64/lib/pkgconfig"
        run: go vet ./...

      - name: test
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-I/mingw64/include"
          CGO_LDFLAGS: "-L/mingw64/lib"
          PKG_CONFIG_PATH: "/mingw64/lib/pkgconfig"
        run: go test ./...

      - name: build
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-I/mingw64/include"
          CGO_LDFLAGS: "-L/mingw64/lib"
          PKG_CONFIG_PATH: "/mingw64/lib/pkgconfig"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/framekit.exe .

          # FFmpeg 运行时 DLL（msys2/mingw64 命名为 av*.dll / sw*.dll，无 lib 前缀）
          cp /mingw64/bin/av*.dll /mingw64/bin/sw*.dll dist/

          # MinGW 运行时（msys2 shared FFmpeg 会依赖这些）
          cp /mingw64/bin/libgcc_s_seh-1.dll dist/
          cp /mingw64/bin/libwinpthread-1.dll dist/
          cp /mingw64/bin/libstdc++-6.dll     dist/ || true

      # 打包成 zip，版本号取自 tag（非 tag 推送用 dev）
      - name: package
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME } else { 'dev' }
          Compress-Archive -Path dist\* -DestinationPath "framekit-$ver-windows-amd64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: framekit-windows-amd64
          path: dist/

      # 只在推送 vX.Y.Z tag 时发布 Release
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = $env:GITHUB_REF_NAME
          gh release create $ver `
            --title $ver `
            --generate-notes `
            "framekit-$ver-windows-amd64.zip"
